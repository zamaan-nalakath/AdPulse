name: AdPulse CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  contracts:
    name: Contracts (test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts -> target
      - name: Unit tests
        run: cargo test --workspace
      - name: Build WASM
        run: |
          rustup target add wasm32v1-none || rustup target add wasm32-unknown-unknown
          cargo build --release --target wasm32v1-none --workspace || \
          cargo build --release --target wasm32-unknown-unknown --workspace

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install & build
        working-directory: frontend
        run: |
          npm ci || npm install
          npm run build

  deploy-testnet:
    name: Deploy testnet (manual)
    runs-on: ubuntu-latest
    needs: [contracts]
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust + Stellar CLI
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          source "$HOME/.cargo/env"
          rustup target add wasm32v1-none
          curl -fsSL https://github.com/stellar/stellar-cli/raw/main/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          stellar --version || sudo install -m 755 "$HOME/.local/bin/stellar" /usr/local/bin/stellar
      - name: Deploy
        env:
          DEPLOY_SECRET: ${{ secrets.ADPULSE_DEPLOY_SECRET }}
        run: |
          if [ -z "$DEPLOY_SECRET" ]; then
            echo "Set ADPULSE_DEPLOY_SECRET to run deploy"
            exit 1
          fi
          bash scripts/deploy.sh
